# Boomtown Platform — Worker deploy, gated
# Version: v0.5.0 · Date: 2026-07-30
# Supersedes: v0.4.0 (2026-07-29)
#
# v0.5.0 — auto-commit the CHANGELOG entry after a green deploy (owner decision 2026-07-30,
# option B: full auto-commit, retiring the manual paste-block ritual). New job 3,
# record-changelog, calls worker/scripts/changelog-entry.mjs — an idempotent, tail-integrity
# guarded prepend proven in six local cases before first use. The 700-line loss (v0.33.1)
# came from an automated process rewriting this file unseen; the write logic is therefore
# a tested script that (a) refuses if line 1 is not the title, (b) aborts if any pre-existing
# byte below the insertion point would change, and (c) is a no-op if the entry already exists,
# so a manual paste and this job never collide. Loop-safe twice over: CHANGELOG.md is not in
# the trigger `paths`, and the commit carries [skip ci]. Requires workflow `contents: write`.
#
# v0.4.0 — F-37. v0.33.2 shipped its 13 tokens tests in a file named 'tokens.test.mjs,'
# (trailing comma). `node --test test/*.mjs` cannot match it, so the suite ran 360/360,
# reported green, and the new tests contributed ZERO — failure classes 1 and 4 landing on
# the very release that shipped this gate. The gate measured the right command against the
# wrong set. The parity step below makes an unmatched file a hard failure, and it also
# forces the deletion of the malformed file: while 'tokens.test.mjs,' exists, no deploy runs.
#
# WHAT CHANGED AND WHY
# --------------------
# v0.2.2 ran ONE of twenty test files (`worker/test/scheduler.test.mjs`) and deployed
# unconditionally. It stayed green for 31 consecutive runs while covering 5% of the suite,
# and on 2026-07-27 run #31 successfully deployed v0.32.0 against a schema missing
# migration 0025. That is failure class 3 from library §2: a guard narrower than the thing
# it guards is worse than no guard, because it reports clean.
#
# Three additions:
#   1. FULL test suite — `node --test test/*.mjs` (standing rule 7). The glob is required;
#      `node --test test/` alone fails with MODULE_NOT_FOUND.
#   2. PRE-deploy schema gate — refuses to deploy when the repo carries a migration D1 has
#      not applied. Fails closed if D1 cannot be read at all.
#   3. POST-deploy version parity — asserts /api/health matches the version string in
#      worker/src/index.js, with a cache buster. A cached 200 that agrees with your notes
#      is more dangerous than a 500; the first health read on 2026-07-27 returned a stale
#      v0.31.0 and nearly concealed the break.
#
# TOKEN SCOPE — READ THIS BEFORE THE FIRST RUN
# CLOUDFLARE_API_TOKEN must now carry **D1:Read** in addition to Workers Scripts:Edit,
# and CLOUDFLARE_ACCOUNT_ID must be set. Without both, the schema gate fails closed and
# nothing deploys. That is intended; widen the token rather than removing the gate.

name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "wrangler.toml"
      - "db/migrations/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

# v0.5.0: the record-changelog job commits back to the repo (owner decision 2026-07-30,
# option B). contents:write is the minimum scope for that single commit; no other job uses it.
permissions:
  contents: write

env:
  D1_NAME: boomtown-prod
  HEALTH_URL: https://boomtown-api.vvisuth.workers.dev/api/health

jobs:
  # ---------------------------------------------------------------------------
  # 1. GATE — everything that can say "no" runs before anything is deployed.
  # ---------------------------------------------------------------------------
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # `node --check <file>` is NOT a syntax check on this codebase. It exits 0 for any .js file
      # containing `export` or `import` even when the file is unparseable — reproduced on both
      # Node 22.23.2 (what this workflow pins) and 24.18.1. Every worker module is ESM, so from
      # v0.2.x until 2026-08-02 this step passed unconditionally, printing "N modules OK" while
      # proving nothing: failure class 3, inside the gate itself. Piping source in with an
      # explicit --input-type=module is the form that actually parses and rejects.
      #
      # The self-test runs first and proves the check can FAIL before any real module is trusted
      # to it. A gate that cannot fail must stop the build, not report clean — that is the whole
      # lesson of this step's history. (Owner OK for this workflow edit, 2026-08-02.)
      - name: Syntax check every worker module
        run: |
          set -euo pipefail
          if printf 'export const a=1;\nfunction ((((broken {\n' | node --check --input-type=module 2>/dev/null; then
            echo "::error::Self-test failed — the syntax check accepted a deliberately broken module. Refusing to report clean."
            exit 1
          fi
          N=0
          for f in worker/src/*.js; do
            node --check --input-type=module < "$f" || { echo "::error::$f does not parse"; exit 1; }
            N=$((N+1))
          done
          test "$N" -ge 30 || { echo "::error::only $N modules scanned — an empty or narrow scan must fail (failure class 4)"; exit 1; }
          echo "syntax: $N modules parse (stdin form; self-test proved the check can fail)"

      - name: Test-file parity — every file in test/ must match the glob (F-37)
        working-directory: worker
        run: |
          set -euo pipefail
          TOTAL=$(ls -1 test | wc -l)
          MATCHED=$(ls -1 test/*.mjs 2>/dev/null | wc -l)
          echo "test/ files: $TOTAL · matched by test/*.mjs: $MATCHED"
          if [ "$TOTAL" -ne "$MATCHED" ]; then
            echo "::error::$((TOTAL-MATCHED)) file(s) in worker/test/ escape 'test/*.mjs' and will silently not run (F-37). Offenders:"
            ls -1 test | grep -v '\.mjs$' || true
            exit 1
          fi

      - name: Full test suite
        working-directory: worker
        run: node --test test/*.mjs

      - name: Read highest applied migration from live D1
        id: d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute "$D1_NAME" --remote --json \
            --command "SELECT MAX(CAST(version AS INTEGER)) AS applied FROM schema_migrations;" \
            > d1.json || { echo "::error::D1 read failed. Check CLOUDFLARE_API_TOKEN has D1:Read and CLOUDFLARE_ACCOUNT_ID is set."; exit 1; }
          APPLIED=$(node -e '
            const j=JSON.parse(require("fs").readFileSync("d1.json","utf8"));
            const rows=(Array.isArray(j)?j:[j]).flatMap(r=>r.results||[]);
            const v=rows.length?rows[0].applied:null;
            if(v===null||v===undefined) process.exit(1);
            process.stdout.write(String(v));
          ')
          echo "applied=$APPLIED" >> "$GITHUB_OUTPUT"
          echo "D1 highest applied migration: $APPLIED"

      - name: Schema gate — block if code is ahead of schema
        run: node worker/scripts/schema-gate.mjs --applied "${{ steps.d1.outputs.applied }}"

  # ---------------------------------------------------------------------------
  # 2. DEPLOY — only reachable when the gate is green.
  # ---------------------------------------------------------------------------
  deploy:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Expected version from source
        id: want
        run: |
          set -euo pipefail
          V=$(grep -oE 'version: "v[0-9]+\.[0-9]+\.[0-9]+"' worker/src/index.js \
              | head -1 | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+')
          test -n "$V" || { echo "::error::No version string found in worker/src/index.js"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "expecting $V"

      - name: Deploy boomtown-api
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Version parity — /api/health must match the source
        run: |
          set -euo pipefail
          WANT='${{ steps.want.outputs.version }}'
          for i in 1 2 3 4 5 6; do
            BODY=$(curl -fsS -H 'Cache-Control: no-cache' "$HEALTH_URL?ci=$GITHUB_RUN_ID-$i" || echo '')
            echo "attempt $i: $BODY"
            case "$BODY" in *"\"$WANT\""*) echo "PARITY OK — health serves $WANT"; exit 0;; esac
            sleep 10
          done
          echo "::error::Deployed but /api/health never reported $WANT. Propagation stall or a wrangler.toml route mismatch — investigate before shipping anything else."
          exit 1

  # ---------------------------------------------------------------------------
  # 3. RECORD — auto-commit the CHANGELOG entry (owner decision 2026-07-30, option B).
  #    Runs ONLY after a green deploy+parity, so a failed release never writes history.
  #    Idempotent: changelog-entry.mjs is a no-op if the entry already exists, so a manual
  #    paste and this job coexist, and re-runs / workflow_dispatch replays never duplicate.
  #    Loop-safe by two independent guards: CHANGELOG.md is absent from the trigger `paths`
  #    (a commit touching only it cannot retrigger), AND the commit carries [skip ci].
  # ---------------------------------------------------------------------------
  record-changelog:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + a token permitted to push back.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve version from source
        id: want
        run: |
          set -euo pipefail
          V=$(grep -oE 'version: "v[0-9]+\.[0-9]+\.[0-9]+"' worker/src/index.js \
              | head -1 | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+')
          test -n "$V" || { echo "::error::No version string in worker/src/index.js"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Prepend CHANGELOG entry (idempotent, tail-integrity guarded)
        id: entry
        run: |
          set -euo pipefail
          node worker/scripts/changelog-entry.mjs \
            --version "${{ steps.want.outputs.version }}" \
            --file CHANGELOG.md
          # Was anything actually changed? (idempotent no-op leaves the file untouched.)
          if git diff --quiet -- CHANGELOG.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "CHANGELOG already had ${{ steps.want.outputs.version }} — nothing to commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.entry.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          # [skip ci] is the second loop-guard (paths-exclusion is the first).
          git commit -m "docs(changelog): record ${{ steps.want.outputs.version }} [skip ci]"
          # Push only if main has not moved under us; a stale push should fail loudly, not force.
          git push origin HEAD:main
