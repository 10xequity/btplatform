<!DOCTYPE html>
<!-- Boomtown Platform — Public Registration · Version: v0.3.0 · Date: 2026-07-21
     Field set replicated from the live Google Forms (spec §3.2) + admin custom fields. -->
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Register · Boomtown Athletics</title>
  <script>/* Pre-paint theme (v0.53.0): saved bt_theme, else system preference, applied before the first stylesheet — the member header paints the right theme on frame one (admin pre-paint v2 precedent, theme half only; member pages carry no rail-collapse state). site-nav.js v2.12 owns the toggle listener. */(function(){try{var t=(window.localStorage&&localStorage.getItem("bt_theme"))||(window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches?"light":"dark");document.documentElement.dataset.theme=t;}catch(e){}})();</script>
  <script>try{var btTpl=localStorage.getItem("bt_template");if(btTpl)document.documentElement.dataset.template=btTpl;}catch(e){}</script>
  <link rel="stylesheet" href="assets/tokens.css?v=0.210.0" />
  <link rel="stylesheet" href="assets/app.css?v=0.210.0" />
  <style>
    /* page-local styles only; design tokens come from tokens.css */
    .reg-card { max-width: 640px; margin: 0 auto; }
    .field { margin-bottom: 14px; display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 0.9rem; opacity: 0.85; }
    .field input, .field select, .field textarea {
      padding: 10px 12px; border-radius: 8px; border: 1px solid rgba(128,128,128,.35);
      background: transparent; color: inherit; font: inherit;
    }
    .field input:focus-visible, .field select:focus-visible, .field textarea:focus-visible { outline: 2px solid var(--accent, #D4AF37); }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 520px) { .two-col { grid-template-columns: 1fr; } }
    .teammate-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 8px; }
    .waiver-box { max-height: 180px; overflow-y: auto; border: 1px solid rgba(128,128,128,.35); border-radius: 8px; padding: 12px; font-size: 0.85rem; opacity: 0.9; }
    .check { flex-direction: row; align-items: center; gap: 10px; }
    .check input { width: 20px; height: 20px; }
    .msg { padding: 12px; border-radius: 8px; margin-top: 12px; }
    .msg.ok { border: 1px solid #3a7; }
    .msg.err { border: 1px solid #c55; }
    .price { font-size: 1.1rem; font-weight: 600; }
  </style>
</head>
<body>
    <header class="header chrome-glass no-print">
    <a class="wordmark" href="index.html" style="text-decoration:none;color:inherit"><img class="brand-logo" src="assets/logo-boom-icon-512.png?v=0.210.0" alt="" width="22" height="22" />Boomtown <span>Athletics</span></a>
    <div class="spacer"></div>
    <a id="btHdrMail" class="btn ghost hdr-mail" href="member-inbox.html" aria-label="Messages">✉</a>
    <button id="themeToggle" class="btn ghost theme-toggle" aria-label="Theme and colors">◐</button>
    <div class="hdr-profile-wrap">
      <button id="btHdrProfile" class="btn ghost hdr-profile" hidden aria-expanded="false" aria-controls="btProfileMenu" aria-label="Account menu">◉</button>
      <div id="btProfileMenu" class="profile-menu" hidden aria-label="Account menu">
        <a class="pm-item" href="home.html#notifications" data-pm-key="notifications">Notifications</a>
        <div class="pm-sep" role="separator"></div>
        <a class="pm-item" href="profile.html">My Profile</a>
        <a class="pm-item" href="membership.html">Membership</a>
        <a class="pm-item" href="settings.html">Settings</a>
        <a class="pm-item" href="help.html">Help &amp; FAQ</a>
        <div class="pm-sep" role="separator"></div>
        <button id="logoutBtn" class="pm-item" hidden>Sign out</button>
      </div>
    </div>
  </header>

  <main class="main" id="app" aria-live="polite">
    <div class="card reg-card" id="regCard">
      <p>Loading event…</p>
    </div>
  </main>

  <script src="assets/site-nav.js?v=0.210.0" defer></script>
  <script src="assets/config.js?v=0.210.0"></script>
  <script src="assets/register.js?v=0.210.0"></script>
</body>
</html>
