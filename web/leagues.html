<!DOCTYPE html>
<!-- Boomtown Platform — Leagues · Version: v1.2 · Date: 2026-08-22 · Ships in: v0.180.0
     Dedicated league area (volleyballlife pattern: leagues are first-class, not a tournament
     footnote): current & upcoming league nights, register links, season standings entry point.
     v1.2 (owner req 2026-08-22): the Sub finder is now its own module (subs.html) reached by the
     top "Sub-Finder" button here and by the rail item — it is no longer embedded on this page.
     v1.1: Sub finder shipped here first (owner req #7). Data now: /api/schedule only. -->
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Leagues — Boomtown Athletics</title>
  <script>/* Pre-paint theme (v0.53.0): saved bt_theme, else system preference, applied before the first stylesheet — the member header paints the right theme on frame one (admin pre-paint v2 precedent, theme half only; member pages carry no rail-collapse state). site-nav.js v2.12 owns the toggle listener. */(function(){try{var t=(window.localStorage&&localStorage.getItem("bt_theme"))||(window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches?"light":"dark");document.documentElement.dataset.theme=t;}catch(e){}})();</script>
  <script>try{var btTpl=localStorage.getItem("bt_template");if(btTpl)document.documentElement.dataset.template=btTpl;}catch(e){}</script>
  <link rel="stylesheet" href="assets/tokens.css?v=0.185.0" />
  <link rel="stylesheet" href="assets/app.css?v=0.185.0" />
  <style>
    .lg-wrap { max-width: 960px; margin: 0 auto; padding: 16px; }
    /* RF-10: the "your league tonight" banner — present only when the signed-in member has a team
       in a league that is live right now. RF-13 (v0.185.0): it now carries TWO actions (see the live
       board, and — for the member's own team — enter scores), so the card is a container, not a
       single link, and each action is its own 44px tap target. */
    .lg-tonight { display: block; padding: 12px 14px; margin-bottom: 12px; border: 1px solid var(--primary);
      border-radius: var(--radius-card); background: var(--surface); color: inherit; }
    .lg-tn-actions { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 6px; }
    .lg-tn-go, .lg-tn-score { color: var(--primary); font-weight: 700; white-space: nowrap;
      text-decoration: none; display: inline-flex; align-items: center; min-height: 44px; }
    .lg-tn-go:hover, .lg-tn-go:focus-visible, .lg-tn-score:hover, .lg-tn-score:focus-visible { text-decoration: underline; }
    .lg-ev { display: flex; gap: 14px; padding: 14px; border: 1px solid var(--border);
      border-radius: var(--radius-card); margin-bottom: 10px; background: var(--surface); }
    .lg-date { min-width: 64px; text-align: center; }
    .lg-date .d { font-size: 22px; font-weight: 700; color: var(--primary); line-height: 1.1; }
    .lg-date .m { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); }
    .lg-body { flex: 1; min-width: 0; }
    .lg-name { font-weight: 600; font-size: 16px; }
    .lg-meta { font-size: 13.5px; color: var(--text-muted); margin-top: 2px; }
    .lg-cta { align-self: center; }
    .empty { color: var(--text-muted); padding: 24px; text-align: center; }
    /* "buttons along the top" (owner req 2026-08-22): a quiet top link to the Sub-Finder module,
       which used to live embedded on this page. Frequent nav → no animation (emil frequency rule);
       .btn already carries :active feedback. */
    .lg-toplinks { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 14px; }
  </style>
  <script>
    (function () {
      document.documentElement.dataset.theme = localStorage.getItem("bt_theme") ||
        (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
    })();
  </script>
</head>
<body>
    <header class="header chrome-glass no-print">
    <a class="wordmark" href="index.html" style="text-decoration:none;color:inherit"><img class="brand-logo" src="assets/logo-boom-icon-512.png?v=0.185.0" alt="" width="22" height="22" />Boomtown <span>Athletics</span></a>
    <div class="spacer"></div>
    <a id="btHdrMail" class="btn ghost hdr-mail" href="member-inbox.html" aria-label="Messages">✉</a>
    <button id="themeToggle" class="btn ghost theme-toggle" aria-label="Toggle dark or light theme">◐</button>
    <button id="logoutBtn" class="btn ghost" hidden>Sign out</button>
  </header>

  <main class="lg-wrap" id="app" aria-live="polite">
    <div class="page-head" style="display:flex;align-items:center;gap:12px">
      <h1 style="font-size:20px;margin:0">Leagues</h1>
      <div class="spacer" style="flex:1"></div>
      <select id="orgFilter" class="org-switcher" aria-label="Filter by organization"><option value="">All orgs</option></select>
    </div>
    <div class="lg-toplinks">
      <a class="btn ghost" href="subs.html" style="text-decoration:none"><span aria-hidden="true">◈</span> Sub-Finder</a>
    </div>
    <!-- RF-10: "your league tonight" — filled by leagues.js tonight() for a signed-in member
         with a team in a live league; empty (and invisible) otherwise. -->
    <div id="lgTonight"></div>
    <div id="lgBody"><div class="empty">Loading leagues&#8230;</div></div>
  </main>

  <script src="assets/site-nav.js?v=0.185.0" defer></script>
  <script src="assets/config.js?v=0.185.0"></script>
  <script src="assets/leagues.js?v=0.185.0" defer></script>
</body>
</html>
