<!DOCTYPE html>
<!-- Boomtown Platform — Member Inbox (M14 Phase B) · Version: v1.0 · Date: 2026-07-24 · Ships in: v0.17.0
     Relay inbox (spec §3.4): threads list + conversation view, reply, block / hide / report.
     All delivery happens through the platform — email addresses are never shown. -->
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inbox — Boomtown Athletics</title>
  <link rel="stylesheet" href="assets/tokens.css" />
  <link rel="stylesheet" href="assets/app.css" />
  <style>
    .ib-main { max-width: 760px; margin: 0 auto; padding: 16px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-card, 10px); padding: 16px; }
    .th-row { display: flex; gap: 12px; align-items: center; padding: 12px 4px; border-bottom: 1px solid var(--border);
      cursor: pointer; border-radius: 8px; min-height: 44px; }
    .th-row:last-child { border-bottom: 0; }
    @media (hover:hover) { .th-row:hover { background: var(--surface-2, #1C1C21); } }
    .th-row .who { flex: 1; min-width: 0; }
    .th-row .who b { display: block; font-size: 15px; }
    .th-row .who span { display: block; font-size: 13px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .th-row .when { flex: none; font-size: 12px; color: var(--text-muted); }
    .th-row .badge { flex: none; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px;
      background: var(--accent); color: var(--bg); font-size: 12px; font-weight: 800; display: grid; place-items: center; }
    .msg { max-width: 84%; margin: 8px 0; padding: 10px 14px; border-radius: 14px; background: var(--surface-2, #1C1C21);
      font-size: 15px; white-space: pre-wrap; word-break: break-word; }
    .msg.mine { margin-left: auto; background: var(--primary); color: var(--bg); border-bottom-right-radius: 4px; }
    .msg .meta { display: block; font-size: 11.5px; opacity: .7; margin-top: 4px; }
    .msg .rpt { font-size: 11.5px; opacity: .7; background: none; border: 0; color: inherit; cursor: pointer; padding: 0; text-decoration: underline; }
    .reply-bar { display: flex; gap: 8px; margin-top: 12px; }
    .reply-bar textarea { flex: 1; min-height: 52px; max-height: 160px; font: inherit; padding: 10px 12px; resize: vertical;
      background: var(--surface-2, #1C1C21); color: var(--text); border: 1px solid var(--border); border-radius: 10px; }
    .thread-tools { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 8px; }
    .help-foot { text-align: center; color: var(--text-muted, #A8A49A); margin: 40px 0 24px; font-size: 15px; }
  </style>
</head>
<body>
  <header class="header chrome-glass">
    <a class="wordmark" href="index.html" style="text-decoration:none">Boomtown <span>Athletics</span></a>
    <div class="spacer"></div>
    <a class="btn ghost" href="library.html">Player Library</a>
  </header>

  <main class="ib-main" id="app" aria-live="polite">
    <div class="page-head"><h1>Inbox</h1></div>
    <div class="card" id="box"><p class="help-text">Loading…</p></div>
  </main>

  <p class="help-foot">Have questions or need help? <a href="mailto:admin@boomtownvb.com">Email us</a></p>

  <script src="assets/config.js?v=0.44.0"></script>
  <script src="assets/site-nav.js?v=0.44.0" defer></script>
  <script src="assets/member-inbox.js?v=0.44.0" defer></script>
</body>
</html>
<!-- Changelog: v1.0 (2026-07-24) — initial Member Inbox page (M14 Phase B). -->
