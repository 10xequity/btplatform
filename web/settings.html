<!DOCTYPE html>
<!-- Boomtown Platform — Settings · Version: v1.1 · Date: 2026-07-25 · Ships in: v0.6.0 (v1.1 in v0.20.0)
     v1.1: PWA manifest/meta + push.js; push toggle rendered by settings.js v1.1.
     Account, sign-in & security (passkeys), appearance, reminders, and (staff) System.
     Requires sign-in; redirects to index.html when no session. -->
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Settings — Boomtown Athletics</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0B0B0D" />
  <link rel="apple-touch-icon" href="assets/logo-boom-icon-512.png" />
  <script>/* Pre-paint theme (v0.53.0): saved bt_theme, else system preference, applied before the first stylesheet — the member header paints the right theme on frame one (admin pre-paint v2 precedent, theme half only; member pages carry no rail-collapse state). site-nav.js v2.12 owns the toggle listener. */(function(){try{var t=(window.localStorage&&localStorage.getItem("bt_theme"))||(window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches?"light":"dark");document.documentElement.dataset.theme=t;}catch(e){}})();</script>
  <link rel="stylesheet" href="assets/tokens.css?v=0.59.0" />
  <link rel="stylesheet" href="assets/app.css?v=0.59.0" />
  <script>
    (function () {
      document.documentElement.dataset.theme = localStorage.getItem("bt_theme") ||
        (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
    })();
  </script>
</head>
<body>
    <header class="header chrome-glass no-print">
    <a class="wordmark" href="index.html" style="text-decoration:none;color:inherit"><img class="brand-logo" src="assets/logo-boom-icon-512.png?v=0.59.0" alt="" width="22" height="22" />Boomtown <span>Athletics</span></a>
    <div class="spacer"></div>
    <a id="btHdrAdmin" class="btn ghost hdr-admin" href="admin.html" aria-label="Switch to admin view" hidden>Admin</a>
    <a id="btHdrMail" class="btn ghost hdr-mail" href="member-inbox.html" aria-label="Messages">✉</a>
    <button id="themeToggle" class="btn ghost theme-toggle" aria-label="Toggle dark or light theme">◐</button>
    <button id="logoutBtn" class="btn ghost" hidden>Sign out</button>
  </header>

  <main class="main settings-wrap" id="app" aria-live="polite">
    <div class="card"><p>Loading your settings&#8230;</p></div>
  </main>

  <script src="assets/site-nav.js?v=0.59.0" defer></script>
  <script src="assets/config.js?v=0.59.0"></script>
  <script src="assets/passkey.js?v=0.59.0" defer></script>
  <script src="assets/push.js?v=0.59.0" defer></script>
  <script src="assets/settings.js?v=0.59.0" defer></script>
</body>
</html>
