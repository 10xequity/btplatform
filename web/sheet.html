<!DOCTYPE html>
<!-- Boomtown Platform — Public Drop-in Sheet (SG-1) · Version: v1.0 · Date: 2026-08-11 · Ships in: v0.132.0
     The SignUpGenius replacement's core: a public URL the organizer advertises. No login needed;
     a signed-in member gets a one-tap sign-up. Names arrive from the server already reduced to
     "First L." (standards §8) — this page renders what it is given. -->
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign-up Sheet — Boomtown Athletics</title>
  <script>/* Pre-paint theme (v0.53.0 pattern): saved bt_theme, else system preference, applied before the first stylesheet. site-nav.js owns the toggle listener. */(function(){try{var t=(window.localStorage&&localStorage.getItem("bt_theme"))||(window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches?"light":"dark");document.documentElement.dataset.theme=t;}catch(e){}})();</script>
  <link rel="stylesheet" href="assets/tokens.css?v=0.138.0" />
  <link rel="stylesheet" href="assets/app.css?v=0.138.0" />
  <style>
    /* page-local styles only; design tokens come from tokens.css */
    .sheet-card { max-width: 560px; margin: 0 auto; }
    .sheet-meta { opacity: .85; margin: 4px 0 0; }
    .sheet-count { display: flex; align-items: baseline; gap: 10px; margin: 18px 0 6px; }
    .sheet-count .n { font-size: 1.5rem; font-weight: 700; }
    .sheet-count .cap { opacity: .75; }
    .price-chip { display: inline-block; padding: 4px 10px; border-radius: 999px; border: 1px solid rgba(128,128,128,.35); font-weight: 600; font-size: .9rem; }
    .who { list-style: none; padding: 0; margin: 8px 0 0; display: flex; flex-wrap: wrap; gap: 8px; }
    .who li { padding: 6px 12px; border-radius: 999px; border: 1px solid rgba(128,128,128,.35); font-size: .95rem; }
    .field { margin-bottom: 14px; display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 0.9rem; opacity: 0.85; }
    .field input { padding: 11px 12px; min-height: 44px; box-sizing: border-box; border-radius: 8px; border: 1px solid rgba(128,128,128,.35); background: transparent; color: inherit; font: inherit; }
    /* focus ring comes from app.css's shared input:focus-visible rule (F-35) — no page copy */
    .hp-field { position: absolute; left: -5000px; width: 1px; height: 1px; opacity: 0; }
    .msg { padding: 12px; border-radius: 8px; margin-top: 12px; }
    .msg.ok { border: 1px solid #3a7; }
    .msg.err { border: 1px solid #c55; }
    .muted { opacity: .75; }
    .sheet-form { margin-top: 20px; padding-top: 16px; border-top: 1px solid rgba(128,128,128,.25); }
  </style>
</head>
<body>
    <header class="header chrome-glass no-print">
    <a class="wordmark" href="index.html" style="text-decoration:none;color:inherit"><img class="brand-logo" src="assets/logo-boom-icon-512.png?v=0.138.0" alt="" width="22" height="22" />Boomtown <span>Athletics</span></a>
    <div class="spacer"></div>
    <a id="btHdrAdmin" class="btn ghost hdr-admin" href="admin.html" aria-label="Switch to admin view" hidden>Admin</a>
    <a id="btHdrMail" class="btn ghost hdr-mail" href="member-inbox.html" aria-label="Messages">✉</a>
    <button id="themeToggle" class="btn ghost theme-toggle" aria-label="Toggle dark or light theme">◐</button>
    <button id="logoutBtn" class="btn ghost" hidden>Sign out</button>
  </header>

  <main class="main" id="app" aria-live="polite">
    <div class="card sheet-card" id="sheetCard">
      <p>Loading sheet…</p>
    </div>
  </main>

  <script src="assets/site-nav.js?v=0.138.0" defer></script>
  <script src="assets/config.js?v=0.138.0"></script>
  <script src="assets/sheet.js?v=0.138.0"></script>
</body>
</html>
