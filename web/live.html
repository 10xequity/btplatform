<!DOCTYPE html>
<!-- Boomtown Platform — Live board (public) · Version: v1.1 · Date: 2026-08-04 · Ships in: v0.84.0
     v1.1: diff-driven motion (owner item 2) and the degraded banner the server has been sending
     since v0.77.0 with nothing rendering it. See the Motion block in <style> for why nothing
     animates on a poll that changed nothing.
     The second of the owner's two views (2026-08-03): admin creates, this one displays.
     READ ONLY AND NO LOGIN. A parent beside court 3 will not sign in, and a TV by the door cannot.
     "On now" sits above everything else because that is the question people open this for.
     Refreshes every 25 seconds and shows when it last did — a board that has quietly stopped
     updating is worse than one that is visibly stale, because nobody double-checks it.
     Team and captain only, and the captain abbreviated to "Ava S." unless that member chose public
     visibility (standards §8) — a junior-league captain is often a minor and this page needs no login.
     No other player names, no notes, no contact details: the server does not send them. -->
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live scores — Boomtown Athletics</title>
  <script>/* Pre-paint theme (v0.53.0): saved bt_theme, else system preference, applied before the first stylesheet — the member header paints the right theme on frame one (admin pre-paint v2 precedent, theme half only; member pages carry no rail-collapse state). site-nav.js v2.12 owns the toggle listener. */(function(){try{var t=(window.localStorage&&localStorage.getItem("bt_theme"))||(window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches?"light":"dark");document.documentElement.dataset.theme=t;}catch(e){}})();</script>
  <link rel="stylesheet" href="assets/tokens.css?v=0.150.0" />
  <link rel="stylesheet" href="assets/app.css?v=0.150.0" />
  <style>
    /* A public scoreboard is read from three feet away on a phone and thirty feet away on a TV, so
       the type scales with the viewport rather than sitting at one size. */
    .lv-wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }
    .lv-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
    .lv-title { font-size: clamp(20px, 3.2vw, 30px); margin: 0; }
    .lv-when { font-size: 13px; color: var(--text-muted); }
    .lv-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 10px 0 18px; }
    .lv-bar select { font: inherit; font-size: 16px; padding: 10px; min-height: 44px; background: var(--surface-2);
      color: var(--text); border: 1px solid var(--border); border-radius: var(--radius-control, 8px); max-width: 100%; }
    /* If the board has silently stopped refreshing, that is worse than obviously stale — so the
       timestamp is always on screen and changes wording when a fetch fails. */
    .lv-stamp { font-size: 12px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
    .lv-stamp.stale { color: var(--emphasis); font-weight: 700; }
    .lv-progress { font-size: 12px; color: var(--text-muted); font-variant-numeric: tabular-nums; }

    .lv-h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted);
      margin: 22px 0 8px; }
    .lv-h3 { font-size: clamp(15px, 1.8vw, 19px); margin: 16px 0 6px; }
    .lv-h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted); margin: 12px 0 4px; }
    .lv-sub { font-size: 11px; font-weight: 400; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; }

    /* On now — the reason anybody opened this page. */
    /* H-4: wider tiles, because the type inside them grew. auto-fill still means one column on a
       phone and a wall of them on a TV — the same grid serves the gym screen and the hub's frame. */
    .lv-courts { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
    .lv-court { background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-card, 10px); padding: 12px 14px; display: grid; gap: 4px; }
    .lv-ct { font-size: clamp(13px, 1.6vw, 16px); font-weight: 700; color: var(--emphasis); }
    .lv-stage { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-muted); }
    .lv-vs { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
    /* The tile is read from across a gym, so the SCORE is the headline and the name is the caption
       — not two lines of the same size, which is what stood here. Both scale with the viewport,
       and the score's floor exceeds the name's ceiling; live_motion.test.mjs asserts that. */
    .lv-t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-size: clamp(14px, 1.7vw, 18px); }
    .lv-sc { font-variant-numeric: tabular-nums; font-weight: 800; min-width: 2ch; text-align: right;
      font-size: clamp(22px, 3.4vw, 40px); line-height: 1.05; color: var(--text); }
    /* The side that is ahead. Weight and full-strength text carry it and the trailing side dims —
       the leader is never signalled by colour alone (standards §3), and gold as text fails
       contrast on a light surface (uiux-review §1). */
    .lv-vs .lv-t:not(.lv-lead) { color: var(--text-muted); }
    .lv-sc:not(.lv-lead) { color: var(--text-muted); font-weight: 700; }
    .lv-t.lv-lead { font-weight: 700; }
    /* The seed the bracket stamps at generation (v0.131.0). A chip, not a sentence: it sits before
       the name, and it is skipped entirely where a team has no seed. */
    .lv-seed { display: inline-block; min-width: 1.6em; margin-right: 6px; padding: 0 5px;
      border: 1px solid var(--border); border-radius: 999px; text-align: center;
      font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums;
      color: var(--text-muted); vertical-align: baseline; }
    .lv-ref { font-size: 10px; color: var(--text-muted); }
    /* The captain, under the team name. Quiet: it identifies who to find, it is not the headline. */
    .lv-cap { display: block; font-size: 10px; font-weight: 400; color: var(--text-muted); }
    .lv-capcell { font-size: 12px; color: var(--text-muted); }
    .lv-none { font-size: 13px; color: var(--text-muted); list-style: none; }

    .lv-div { margin-bottom: 18px; }
    .lv-scroll { overflow-x: auto; }
    .lv-table { width: 100%; border-collapse: collapse; min-width: 380px; }
    .lv-table th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .04em;
      color: var(--text-muted); padding: 4px 8px; }
    .lv-table td { padding: 6px 8px; border-top: 1px solid var(--border); font-size: 14px; }
    /* Compared numbers line up or they cannot be compared. */
    .lv-table td:first-child, .lv-table td:nth-child(n+4) { font-variant-numeric: tabular-nums; text-align: right; }
    .lv-table td:nth-child(2), .lv-table td:nth-child(3) { text-align: left; }
    .lv-table th:first-child, .lv-table th:nth-child(n+4) { text-align: right; }

    .lv-brscroll { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 6px; align-items: flex-start; }
    .lv-brround { flex: 0 0 auto; min-width: 175px; }
    .lv-brh { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted); margin: 0 0 6px; }
    .lv-brlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    .lv-brm { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-control, 8px);
      padding: 6px 8px; display: grid; gap: 2px; font-size: 13px; }
    .lv-brm span { display: flex; justify-content: space-between; gap: 8px; }
    .lv-brm b { font-variant-numeric: tabular-nums; font-weight: 700; }
    .lv-brm .won { color: var(--emphasis); font-weight: 700; }

    /* ---- Motion · v0.84.0 · owner item 2 ------------------------------------------------------
       "add cool animations to the live view so when things are updated there is an animation that
       is engaging for viewers."

       THE WHOLE DESIGN IS ONE DECISION: the page diffs each payload against the previous one and
       animates ONLY what changed. `render()` replaces innerHTML wholesale every 25 seconds, so an
       enter-animation written the obvious way would replay on every card on every poll — motion
       every 25 seconds that means nothing, which is exactly the "no enter-animation on
       high-frequency controls" rule in standards §5. A poll where nothing changed animates nothing.
       That is why this is engaging rather than noisy: when something moves, something happened.

       Tokens only. --ease-out, --dur-pop and --dur-modal come from tokens.css and are not restated
       here. No new motion values are invented.

       ON THE TWO DURATIONS THAT ARE NOT UNDER 300ms, DELIBERATELY: the 900ms card flash and the
       colour settle are DECAYS, not responses to a user action. The ≤300ms rule governs how fast
       the interface answers a tap; nothing here is a tap. The movement inside each effect is
       --dur-pop (180ms) or --dur-modal (240ms); only the fade-back is slow, because a highlight
       that vanishes in 180ms on a board read from thirty feet away has not been seen at all. */

    /* A final score landing on a court card. The one animation anybody will actually notice. */
    @keyframes lv-pop   { from { transform: scale(0.94); } to { transform: scale(1); } }
    /* Never from scale(0): nothing in the real world appears out of nothing. */
    @keyframes lv-enter { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }
    @keyframes lv-decay { from { opacity: .16; } to { opacity: 0; } }

    /* The flash is a composited overlay fading its opacity, not an animated background colour —
       transform and opacity are the only two properties that skip layout and paint. Gold is used
       here as a BACKGROUND at low alpha, never as text (the gold rule, uiux-review §1). */
    .lv-court { position: relative; }
    .lv-court::after { content: ""; position: absolute; inset: 0; border-radius: inherit;
      background: var(--accent); opacity: 0; pointer-events: none; }
    .lv-court.lv-changed::after { animation: lv-decay 900ms var(--ease-out); }

    .lv-court.lv-enter { animation: lv-enter var(--dur-pop) var(--ease-out) both; }

    /* --emphasis, not --accent: measured 14.22:1, and gold as text on a light surface is 1.87:1. */
    .lv-sc { transition: color var(--dur-modal) var(--ease-out); }
    .lv-sc.lv-changed { animation: lv-pop var(--dur-pop) var(--ease-out); color: var(--emphasis); }

    /* A team changing rank is the most engaging thing on a scoreboard — "we moved to second".
       The row travels from where it was to where it now is (a FLIP): it is already on screen and
       moving from A to B, so ease-in-out, not ease-out. */
    .lv-table tr.lv-move { transition: transform var(--dur-modal) var(--ease-in-out); }

    /* Rarest moment of the whole event, so it earns one pop. */
    .lv-champ { display: inline-block; }
    .lv-champ.lv-enter { animation: lv-pop var(--dur-modal) var(--ease-out); }

    /* Reduced motion kills animation as well as transition. tokens.css already does this globally;
       it is repeated here because this page defines keyframes of its own, and the previous version
       of this block covered `transition` only — which would have let every @keyframes above through. */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; animation: none !important; }
    }
  </style>
  <script>
    (function () {
      document.documentElement.dataset.theme = localStorage.getItem("bt_theme") ||
        (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
    })();
  </script>
</head>
<body>
    <header class="header chrome-glass no-print">
    <a class="wordmark" href="index.html" style="text-decoration:none;color:inherit"><img class="brand-logo" src="assets/logo-boom-icon-512.png?v=0.150.0" alt="" width="22" height="22" />Boomtown <span>Athletics</span></a>
    <div class="spacer"></div>
    <a id="btHdrAdmin" class="btn ghost hdr-admin" href="admin.html" aria-label="Switch to admin view" hidden>Admin</a>
    <a id="btHdrMail" class="btn ghost hdr-mail" href="member-inbox.html" aria-label="Messages">✉</a>
    <button id="themeToggle" class="btn ghost theme-toggle" aria-label="Toggle dark or light theme">◐</button>
    <button id="logoutBtn" class="btn ghost" hidden>Sign out</button>
  </header>

  <main class="lv-wrap" id="app">
    <div class="lv-head">
      <h1 class="lv-title" id="lvTitle">Loading&#8230;</h1>
      <span class="lv-when" id="lvWhen"></span>
    </div>

    <div class="lv-bar">
      <label class="sr-only" for="lvEvent">Choose an event</label>
      <select id="lvEvent"></select>
      <button class="btn ghost" id="lvRefresh" type="button">Refresh</button>
      <span class="spacer" style="flex:1"></span>
      <span class="lv-progress" id="lvProgress"></span>
      <span class="lv-stamp" id="lvStamp" role="status" aria-live="polite"></span>
    </div>

    <!-- The server has sent `degraded` and `degraded_note` since v0.77.0 and no page has ever
         rendered either. A board missing a section was silently asserting that section was empty:
         an empty bracket reads as "there is no bracket", which is a wrong answer presented as a
         fact. This says so in words instead, and when it is showing, the page animates NOTHING —
         a partial read makes "what changed" unknowable, and motion would dress a guess as a fact. -->
    <p class="notice error" id="lvDegraded" role="status" aria-live="polite" hidden></p>

    <div id="lvBody">
      <h2 class="lv-h2">On now <span class="lv-sub" id="lvRound"></span></h2>
      <ul class="lv-courts" id="lvNow"></ul>

      <div id="lvNextWrap" hidden>
        <h2 class="lv-h2">Up next</h2>
        <ul class="lv-courts" id="lvNext"></ul>
      </div>

      <div id="lvBracketWrap" hidden>
        <h2 class="lv-h2">Brackets</h2>
        <div id="lvBrackets"></div>
      </div>

      <h2 class="lv-h2">Standings</h2>
      <div id="lvStand"></div>
    </div>
  </main>

  <script src="assets/site-nav.js?v=0.150.0" defer></script>
  <script src="assets/config.js?v=0.150.0"></script>
  <script src="assets/live.js?v=0.150.0" defer></script>
</body>
</html>
