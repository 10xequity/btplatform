<!DOCTYPE html>
<!-- Boomtown Platform — Play · Version: v1.0 · Date: 2026-08-25 · Ships in: v0.202.0
     §-1g C-2, the member half of the owner's 2026-08-08 frame sentence: the Play group's five
     surfaces (Event Schedule · Leagues · Live scores · Community Play · Sub-Finder) as horizontal
     tabs that do NOT reload — each tab the EXISTING page in a same-origin chromeless iframe,
     created on first visit and kept (the v0.139.0 manager-hub idiom, reused not reinvented).
     Generated from the Leagues page's bytes so the member header is byte-identical on its first
     run (header_shell's ratchet, the intended way). The pane list lives ONLY in assets/play.js —
     member_frame.test.mjs bans pane filenames from this markup, comments included, so the list
     cannot grow a second home. -->
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Play · Boomtown Athletics</title>
  <script>/* Pre-paint theme (v0.53.0): saved bt_theme, else system preference, applied before the first stylesheet — the member header paints the right theme on frame one (admin pre-paint v2 precedent, theme half only; member pages carry no rail-collapse state). site-nav.js v2.12 owns the toggle listener. */(function(){try{var t=(window.localStorage&&localStorage.getItem("bt_theme"))||(window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches?"light":"dark");document.documentElement.dataset.theme=t;}catch(e){}})();</script>
  <script>try{var btTpl=localStorage.getItem("bt_template");if(btTpl)document.documentElement.dataset.template=btTpl;}catch(e){}</script>
  <link rel="stylesheet" href="assets/tokens.css?v=0.205.0" />
  <link rel="stylesheet" href="assets/app.css?v=0.205.0" />
  <style>
    /* The frame page hosts full pages, so its main is full-width; each framed page centers its own
       content. Tab chrome is page-local for now: no member page shares a tab component yet, and
       page-local classes promoted to app.css on their SECOND user is the D-23/D-24 rule, not their
       first. Weight lives on the BASE tab so the row never reflows under the pointer
       (press_stability's rule); the active state changes color and border only. */
    .pf-wrap { padding: 12px 16px; }
    .pf-tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--border);
      margin-bottom: 10px; }
    .pf-tab { min-height: 44px; padding: 8px 14px; border: 0; border-bottom: 2px solid transparent;
      background: none; color: var(--text-muted); font: inherit; font-weight: 600;
      cursor: pointer; white-space: nowrap; }
    .pf-tab.active { color: var(--primary); border-bottom-color: var(--primary); }
    .pf-tab:hover, .pf-tab:focus-visible { color: var(--text); }
    .pf-frame { width: 100%; border: 0; display: block; min-height: 420px; background: var(--bg); }
    .empty { color: var(--text-muted); padding: 24px; text-align: center; }
  </style>
  <script>
    (function () {
      document.documentElement.dataset.theme = localStorage.getItem("bt_theme") ||
        (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
    })();
  </script>
</head>
<body>
    <header class="header chrome-glass no-print">
    <a class="wordmark" href="index.html" style="text-decoration:none;color:inherit"><img class="brand-logo" src="assets/logo-boom-icon-512.png?v=0.205.0" alt="" width="22" height="22" />Boomtown <span>Athletics</span></a>
    <div class="spacer"></div>
    <a id="btHdrMail" class="btn ghost hdr-mail" href="member-inbox.html" aria-label="Messages">✉</a>
    <button id="themeToggle" class="btn ghost theme-toggle" aria-label="Theme and colors">◐</button>
    <div class="hdr-profile-wrap">
      <button id="btHdrProfile" class="btn ghost hdr-profile" hidden aria-expanded="false" aria-controls="btProfileMenu" aria-label="Account menu">◉</button>
      <div id="btProfileMenu" class="profile-menu" hidden aria-label="Account menu">
        <a class="pm-item" href="home.html#notifications" data-pm-key="notifications">Notifications</a>
        <div class="pm-sep" role="separator"></div>
        <a class="pm-item" href="profile.html">My Profile</a>
        <a class="pm-item" href="membership.html">Membership</a>
        <a class="pm-item" href="settings.html">Settings</a>
        <a class="pm-item" href="help.html">Help &amp; FAQ</a>
        <div class="pm-sep" role="separator"></div>
        <button id="logoutBtn" class="pm-item" hidden>Sign out</button>
      </div>
    </div>
  </header>

  <main class="pf-wrap" id="app">
    <h1 style="font-size:var(--fs-h1);margin:0 0 10px">Play</h1>
    <div class="pf-tabs" role="tablist" id="pfTabs" aria-label="Play sections"></div>
    <div id="pfPanes"><div class="empty">Loading&#8230;</div></div>
    <noscript><p class="empty">This page needs JavaScript. The schedule, leagues, live scores, community play and sub finder pages each work on their own address too.</p></noscript>
  </main>

  <script src="assets/site-nav.js?v=0.205.0" defer></script>
  <script src="assets/config.js?v=0.205.0"></script>
  <script src="assets/play.js?v=0.205.0" defer></script>
</body>
</html>
